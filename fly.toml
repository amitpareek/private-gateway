# Fly.io configuration for private-gateway.
#
# private-gateway is a Fly 6PN Postgres proxy. Setting the TS_AUTHKEY secret also
# turns it into a real tailscaled (TUN) subnet router + exit node, so the
# tailnet can reach Fly apps (incl. private-gateway) via *.internal once split DNS
# is configured. Omit TS_AUTHKEY for a plain 6PN-only proxy. See project.md
# for the architecture and the full config table.
#
# Before first deploy:
#
#   fly apps create private-gateway
#   fly secrets set TS_AUTHKEY="tskey-auth-..."        # ephemeral+reusable+tagged; omit for 6PN-only
#   fly deploy
#
# Then, one-time in the Tailscale admin console:
#   - approve the advertised routes (or grant an autoApprovers ACL to the tag)
#   - split DNS: "internal" search domain -> this node's Tailscale IP
#
# Add databases later (secret; contains passwords):
#   fly secrets set DESTINATION_PG_DBS='[
#     {"name":"rw","listen":5432,"target":"ep-xxx.aws.neon.tech:5432",
#      "dbname":"main","user":"app_user","password":"..."},
#     {"name":"admin","listen":5439,"target":"ep-xxx.aws.neon.tech:5432"}
#   ]'
#   fly deploy
#
# Secrets (never put these in [env]): TS_AUTHKEY, DESTINATION_PG_DBS.

# Default app name; the actual app is set at deploy time (e.g. `fly deploy -a <name>`).
app = "private-gateway"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Zero-config: set TS_AUTHKEY (a secret, via `fly secrets set`) to enable
  # Tailscale; omit it for a 6PN-only proxy. Every other knob has a default in
  # fly-router.sh / the binary; the full list with rationale is in project.md.
  # Set a var here only to override a default, e.g.:
  #
  # TS_ADVERTISE_ROUTES  = "fdaa::/16"   # default: auto-derive the org /48
  #
  # Environment aliases: set ALIAS_DOMAIN to reach apps as <app>.<env> (e.g.
  # core.prod) over the tailnet. INTERNAL_DOMAIN auto-defaults to "internal" on
  # Fly, so core.prod resolves like core.internal (additive; .internal is
  # unchanged). Then add Tailscale split DNS: "prod" -> this node's Tailscale IP.
  #
  # ALIAS_DOMAIN = "prod"

  # Let tailnet clients use the HTTPS CONNECT proxy on 8080, not just Fly
  # 6PN. Needed for *.internal names to work from the tailnet at all: the
  # DNS self-rewrite points them at this node's Tailscale IP, which skips
  # the subnet route (and its SNAT to a 6PN source). Note this lends the
  # app's fixed Fly egress IP to any device on the tailnet.
  HTTP_PROXY_ALLOW_TAILSCALE = "true"

[[vm]]
  size      = "shared-cpu-1x"
  memory_mb = 512

# No [[services]] block: private-gateway is internal-only. Postgres (per-db listen
# ports), HTTPS CONNECT (8080), debug/dev page (80), and the .internal DNS
# forwarder (53) are reached over Fly 6PN and, for the tailnet, through this
# machine's own Tailscale subnet router.
